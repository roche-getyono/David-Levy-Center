<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מרכז מורשת דוד לוי — הצעות מיתוג</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;500;600;700;800&family=DM+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #FAF8F5;
      color: #0F172A;
      font-family: 'Heebo', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    .page-container {
      width: 100%;
      max-width: 1100px;
      height: 100vh;
      max-height: 1100px;
      margin: 0 auto;
      padding: 2.2rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .main-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 2.4rem;
      font-weight: 900;
      color: #1D4ED8;
      text-align: center;
    }

    .quote-card {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 1.4rem 2rem;
      text-align: center;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      border-inline-start: 6px solid #1D4ED8;
    }

    .quote-p1 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.3rem;
      color: #0F172A;
      line-height: 1.6;
      margin-bottom: 0.6rem;
    }

    .quote-p2 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.25rem;
      color: #1D4ED8;
      line-height: 1.6;
      font-weight: 700;
    }

    .options-grid {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      flex-grow: 1;
      margin-block: 1rem;
      align-items: center;
    }

    .option-card {
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
      height: 100%;
      max-height: 440px;
    }

    .img-box {
      width: 100%;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .badge-num {
      background: #1D4ED8;
      color: #ffffff;
      font-family: 'Heebo', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0.4rem 1.6rem;
      border-radius: 6px;
    }

    .footer {
      font-size: 0.85rem;
      color: #64748B;
      font-family: 'DM Mono', monospace;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <div class="main-title">מרכז מורשת דוד לוי</div>

    <div class="quote-card">
      <div class="quote-p1">
        הפסיפס מבטא את הייחודיות של כל קהילה ואדם. יחד הם משקפים את האמונה שעוצמת החברה נובעת מהשונות ומהיכולת ליצור ממנה שלם אחד.
      </div>
      <div class="quote-p2">
        הגשר מסמל חיבור בין חלקי העם.<br>
        העיגול את האחדות.
      </div>
    </div>

    <div class="options-grid">
      <!-- Option 1 -->
      <div class="option-card">
        <div class="img-box">
          <img src="final_logo_bridge.jpg" alt="הצעה מס׳ 1">
        </div>
        <div class="badge-num">הצעה מס׳ 1</div>
      </div>

      <!-- Option 2 -->
      <div class="option-card">
        <div class="img-box">
          <img src="final_logo_circle.jpg" alt="הצעה מס׳ 2">
        </div>
        <div class="badge-num">הצעה מס׳ 2</div>
      </div>
    </div>

    <div class="footer">
      מרכז מורשת דוד לוי (ע"ר)
    </div>

  </div>

</body>
</html>
