<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מרכז מורשת דוד לוי — הצעות מיתוג</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF8F5;
      color: #0F172A;
      font-family: 'Heebo', sans-serif;
      padding: 0;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    
    .header-banner {
      background: #1D4ED8;
      color: #ffffff;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .header-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 2.6rem;
      font-weight: 900;
    }

    .quote-box {
      max-width: 860px;
      margin: 2.2rem auto 1.5rem auto;
      padding: 1.8rem 2.2rem;
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
      border-inline-start: 6px solid #1D4ED8;
    }

    .quote-p1 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.4rem;
      color: #0F172A;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .quote-p2 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.3rem;
      color: #1D4ED8;
      line-height: 1.7;
      font-weight: 700;
    }

    .container {
      max-width: 1040px;
      margin: 1.5rem auto 2.5rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.05);
      text-align: center;
    }

    .card-img-wrap {
      width: 100%;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.2rem;
    }

    .card-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .option-num-badge {
      background: #1D4ED8;
      color: #ffffff;
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.4rem 1.2rem;
      border-radius: 4px;
    }

    .footer-bar {
      text-align: center;
      padding: 1.8rem;
      color: #64748B;
      font-size: 0.9rem;
      border-top: 1px solid #E2E8F0;
    }
  </style>
</head>
<body>

  <div class="header-banner">
    <div class="header-title">מרכז מורשת דוד לוי</div>
  </div>

  <div class="quote-box">
    <div class="quote-p1">
      הפסיפס מבטא את הייחודיות של כל קהילה ואדם. יחד הם משקפים את האמונה שעוצמת החברה נובעת מהשונות ומהיכולת ליצור ממנה שלם אחד.
    </div>
    <div class="quote-p2">
      הגשר מסמל חיבור בין חלקי העם.<br>
      העיגול את האחדות.
    </div>
  </div>

  <div class="container">

    <!-- Option 1: The Bridge -->
    <div class="card">
      <div class="card-img-wrap">
        <img src="final_logo_bridge.jpg" alt="הצעה מס׳ 1">
      </div>
      <div class="option-num-badge">הצעה מס׳ 1</div>
    </div>

    <!-- Option 2: The Circle -->
    <div class="card">
      <div class="card-img-wrap">
        <img src="final_logo_circle.jpg" alt="הצעה מס׳ 2">
      </div>
      <div class="option-num-badge">הצעה מס׳ 2</div>
    </div>

  </div>

  <div class="footer-bar">
    מרכז מורשת דוד לוי
  </div>

</body>
</html>
